server:
  port: ${PORT:8085}

spring:
  application:
    name: ms-notificaciones
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

emailjs:
  service-id: ${EMAILJS_SERVICE_ID}
  public-key: ${EMAILJS_PUBLIC_KEY}
  private-key: ${EMAILJS_PRIVATE_KEY}
  api-url: ${EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
  templates:
    reserva: "template_zfrdshb"
    contacto: "template_84uq0gf"